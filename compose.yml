services:
  cupsd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cupsd
    privileged: true
    restart: unless-stopped
    # Host networking so mDNS printer announcements reach the LAN
    network_mode: host
    environment:
      CUPS_ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD:-}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - cups-config:/etc/cups
volumes:
  cups-config:
